name: Baseline validation

# Minutes are the scarce thing: a private repository's monthly allowance
# went on 2026-09-06 after two days of pushes, each one billing the macOS
# universal build at ten times its wall clock. So a push that touches only
# documents builds nothing, and a newer push on the same branch cancels the
# run of the older one.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check -p jlr-scanner-shell

  windows-alpha-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --no-sign --config apps/scanner/src-tauri/tauri.alpha.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: jlr-scanner-windows-unsigned-alpha-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # An unsigned, un-notarised universal disk image (Apple silicon and Intel)
  # for the tester programme; the first launch needs "Open Anyway", as
  # docs/TESTER_GUIDE.md describes. This job is also the macOS compile check.
  macos-alpha-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --target universal-apple-darwin --config apps/scanner/src-tauri/tauri.alpha-macos.conf.json
      # Apple silicon refuses to start a bundle with no signature at all —
      # Finder's terse "cannot be opened", with no "Open Anyway" — so the
      # bundle is sealed with an ad-hoc signature (identity "-": no Apple
      # account, no notarisation). Gatekeeper still asks once, as the tester
      # guide describes; a real identity replaces "-" in M4.
      - name: Ad-hoc sign the bundle and say what it is
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/JLR Scanner.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -12
          lipo -info "$APP/Contents/MacOS/jlr-scanner-shell"
          spctl --assess --type execute --verbose=2 "$APP" || echo "Gatekeeper would ask, as expected without notarisation"
      - name: Disk image from the sealed bundle
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/JLR Scanner.app"
          mkdir -p dist-dmg/root
          cp -R "$APP" dist-dmg/root/
          ln -s /Applications dist-dmg/root/Applications
          hdiutil create -volname "JLR Scanner" -srcfolder dist-dmg/root -ov -format UDZO "dist-dmg/JLR Scanner_0.9.0_universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: jlr-scanner-macos-unsigned-alpha-${{ github.sha }}
          path: dist-dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
